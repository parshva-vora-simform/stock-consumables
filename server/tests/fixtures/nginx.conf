upstream api_instances {
    # Default round-robin: consecutive requests alternate between instances.
    server server-a:4000;
    server server-b:4000;
}

server {
    listen 80;

    location / {
        proxy_pass http://api_instances;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Which instance served the request — the multi-instance test asserts
        # the burst actually hit both, otherwise it proves nothing.
        add_header X-Upstream $upstream_addr always;
    }
}
