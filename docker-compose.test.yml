# Two API instances behind one Postgres, for T-6.
#
# The point: an in-memory lock or a process-local queue would pass the
# single-instance race test (T-5) and fail here. Passing this proves the
# zero-floor guarantee lives in the database, not in application state.

name: stock-consumables-test

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stock
      POSTGRES_PASSWORD: stock_test
      POSTGRES_DB: stock_test
    ports:
      - '5433:5432'
    # No volume: this database is disposable by design.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stock -d stock_test']
      interval: 2s
      timeout: 3s
      retries: 20

  migrate-test:
    build: { context: ., dockerfile: server/Dockerfile, target: builder }
    environment:
      DATABASE_URL: postgresql://stock:stock_test@postgres-test:5432/stock_test?schema=public
    command: sh -c "pnpm --filter @stock/server prisma:deploy"
    depends_on:
      postgres-test: { condition: service_healthy }

  server-a: &test_server
    build: { context: ., dockerfile: server/Dockerfile, target: runner }
    environment:
      DATABASE_URL: postgresql://stock:stock_test@postgres-test:5432/stock_test?schema=public
      PORT: 4000
      NODE_ENV: test
      LOG_LEVEL: warn
      JWT_SECRET: test_secret_at_least_32_characters_long_ok
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      WEB_ORIGIN: http://localhost:5173
      INSTANCE_ID: server-a
    depends_on:
      migrate-test: { condition: service_completed_successfully }

  server-b:
    <<: *test_server
    environment:
      DATABASE_URL: postgresql://stock:stock_test@postgres-test:5432/stock_test?schema=public
      PORT: 4000
      NODE_ENV: test
      LOG_LEVEL: warn
      JWT_SECRET: test_secret_at_least_32_characters_long_ok
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      WEB_ORIGIN: http://localhost:5173
      INSTANCE_ID: server-b

  # Round-robins each request between the two instances, so a concurrent burst
  # genuinely lands on both processes.
  lb:
    image: nginx:1.27-alpine
    ports:
      - '4100:80'
    volumes:
      - ./server/tests/fixtures/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - server-a
      - server-b
